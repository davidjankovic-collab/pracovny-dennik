name: Obedy
on:
  schedule:
    - cron: "30 4,8 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stiahnut obedy
        run: |
          curl -fsSL -A "Mozilla/5.0" "https://www.gratis.sk/obedy/cely-tyzden?idRestauracia=11" -o raw.html
          python3 - <<'PY'
          import re
          s = open("raw.html", encoding="utf-8", errors="ignore").read()
          s = re.sub(r"<script\b.*?</script>", "", s, flags=re.S | re.I)
          s = re.sub(r"<style\b.*?</style>", "", s, flags=re.S | re.I)
          s = re.sub(r"<meta[^>]*csrf[^>]*>", "", s, flags=re.I)
          s = re.sub(r"<input[^>]*token[^>]*>", "", s, flags=re.I)
          s = re.sub(r"<!--.*?-->", "", s, flags=re.S)
          s = re.sub(r"\n\s*\n+", "\n", s)
          open("obedy.html", "w", encoding="utf-8").write(s)
          PY
          rm raw.html
      - name: Ulozit
        run: |
          git config user.name "obedy-bot"
          git config user.email "obedy-bot@users.noreply.github.com"
          git add obedy.html
          git diff --cached --quiet || (git commit -m "Aktualizacia obedov" && git push)
